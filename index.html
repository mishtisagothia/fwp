        function jan() {
            var totalPaidLeave = 12;
            var janLeave = document.getElementById("janLeave").value;
            var empSalary = document.getElementById("empSalary").value;
            if (janLeave >= 3) {
                var janPaid = 3;
            } else {
                var janPaid = janLeave
            }
            var janRemain = totalPaidLeave - janPaid;
            var janUnPaid = janLeave - janPaid;

            perDaySalary = empSalary / 31;
            salary = empSalary - (perDaySalary * janUnPaid);

            document.getElementById("janPaid").value = janPaid;
            document.getElementById("janUnPaid").value = janUnPaid;
            document.getElementById("janRemain").value = janRemain;
            document.getElementById("janSalary").value = salary.toFixed(2);
            cl = janRemain;

        function add(month) {
